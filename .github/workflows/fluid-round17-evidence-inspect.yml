name: Inspect Fluid Round17 Evidence

on:
  workflow_run:
    workflows: ["Fluid Round17 Cascade Direction"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download round17 evidence
        uses: actions/download-artifact@v4
        with:
          name: fluid-cascade-direction-round17-results
          path: evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Print staged evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import json

          root = Path('evidence')
          print('=== UPSTREAM ===')
          print(json.dumps({
              'run_id': '${{ github.event.workflow_run.id }}',
              'conclusion': '${{ github.event.workflow_run.conclusion }}',
              'head_sha': '${{ github.event.workflow_run.head_sha }}',
          }, indent=2))
          print('=== FILES ===')
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  print(path)

          def locate(name):
              matches = list(root.rglob(name))
              return matches[0] if matches else None

          for name in ['FAILURE.json', 'SUMMARY.json', 'DATA_AUDIT.json', 'DISCOVERY_PROMOTED.json', 'CONFIRMED.json']:
              path = locate(name)
              if path:
                  print(f'=== {name} ===')
                  print(path.read_text())

          for name in [
              'FROZEN_SELECTION.csv',
              'DISCOVERY_VALIDATION_RESULTS.csv',
              'DISCOVERY_HOLDOUT_RESULTS.csv',
              'REPLICATION_VALIDATION_RESULTS.csv',
              'REPLICATION_HOLDOUT_RESULTS.csv',
          ]:
              path = locate(name)
              if not path or path.stat().st_size == 0:
                  continue
              print(f'=== {name} ===')
              with path.open(newline='') as handle:
                  rows = list(csv.DictReader(handle))
              if 'VALIDATION' in name:
                  keep = [row for row in rows if row.get('validation_gate', '').lower() == 'true']
                  rows = keep if keep else sorted(rows, key=lambda row: float(row.get('cs_rankic') or '-inf'), reverse=True)[:8]
              print(json.dumps(rows, indent=2, sort_keys=True))
          PY
