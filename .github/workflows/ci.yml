name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m compileall -q src tests examples experiments
      - run: bash -n experiments/actr20_public/run_all.sh
      - run: pytest --cov=timesafe_quant --cov-report=term-missing --cov-fail-under=85

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install build
      - run: python -m build
      - run: python -m venv /tmp/timesafe-wheel
      - run: /tmp/timesafe-wheel/bin/pip install dist/*.whl
      - run: /tmp/timesafe-wheel/bin/python -c "import timesafe_quant; assert timesafe_quant.__version__ == '0.3.1'"
      - run: /tmp/timesafe-wheel/bin/timesafe demo --output /tmp/timesafe_demo.json
