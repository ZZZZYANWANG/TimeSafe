name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[fluid-round15]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m compileall -q src tests examples experiments
      - run: bash -n experiments/actr20_public/run_all.sh
      - run: pytest --cov=timesafe_quant --cov-report=term-missing --cov-fail-under=85

  package-smoke:
    if: ${{ !contains(github.event.head_commit.message, '[fluid-round15]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install build
      - run: python -m build
      - run: python -m venv /tmp/timesafe-wheel
      - run: /tmp/timesafe-wheel/bin/pip install dist/*.whl
      - run: /tmp/timesafe-wheel/bin/python -c "import timesafe_quant; assert timesafe_quant.__version__ == '0.3.1'"
      - run: /tmp/timesafe-wheel/bin/timesafe demo --output /tmp/timesafe_demo.json

  fluid-round15:
    if: ${{ contains(github.event.head_commit.message, '[fluid-round15]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone isolated research branch
        run: |
          git clone --depth 1 --branch research-ashare-fluid-characteristic-network-round15-20261119 https://github.com/ZZZZYANWANG/TradingView-API.git research-repo
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn baostock tabulate
      - name: Run A-share characteristic-network research
        working-directory: research-repo
        shell: bash
        run: |
          set -o pipefail
          rm -rf research_outputs/ashare_fluid_round15
          mkdir -p research_outputs/ashare_fluid_round15
          python research/ashare_fluid_round15/run_characteristic_network.py 2>&1 | tee research_outputs/ashare_fluid_round15/run.log
      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashare-fluid-round15-results
          path: research-repo/research_outputs/ashare_fluid_round15
          if-no-files-found: warn
          retention-days: 14
