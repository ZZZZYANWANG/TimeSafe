name: A-share Share Supply Research

on:
  push:
    branches: [main]
    paths:
      - experiments/ashare_share_supply_trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone isolated research branch
        run: |
          git clone --depth 1 --branch research-ashare-share-supply-20261120 https://github.com/ZZZZYANWANG/TradingView-API.git research-repo
      - name: Restore research cache
        uses: actions/cache@v4
        with:
          path: |
            research-repo/research_outputs/ashare_event_absorption/cache
            research-repo/research_outputs/ashare_share_supply/cache
          key: ashare-share-supply-v1-${{ runner.os }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn pyarrow requests baostock
      - name: Run share-supply study
        working-directory: research-repo
        shell: bash
        run: |
          set -o pipefail
          mkdir -p research_outputs/ashare_share_supply
          if [ -f research/ashare_share_supply/run_research_v3_parent_dedup.py ]; then
            python research/ashare_share_supply/run_research_v3_parent_dedup.py 2>&1 | tee research_outputs/ashare_share_supply_run.log
          elif [ -f research/ashare_share_supply/run_research_v2_blocks.py ]; then
            python research/ashare_share_supply/run_research_v2_blocks.py 2>&1 | tee research_outputs/ashare_share_supply_run.log
          else
            python research/ashare_share_supply/run_research.py 2>&1 | tee research_outputs/ashare_share_supply_run.log
          fi
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashare-share-supply-results
          path: |
            research-repo/research_outputs/ashare_share_supply/*.csv
            research-repo/research_outputs/ashare_share_supply/*.json
            research-repo/research_outputs/ashare_share_supply_run.log
          if-no-files-found: warn
          retention-days: 14
