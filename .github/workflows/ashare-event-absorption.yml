name: A-share Event Absorption Research

on:
  push:
    branches: [main]
    paths:
      - experiments/ashare_event_absorption_trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone isolated research branch
        run: |
          git clone --depth 1 --branch research-ashare-event-absorption-20261120 https://github.com/ZZZZYANWANG/TradingView-API.git research-repo
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn pyarrow requests baostock akshare tabulate matplotlib
      - name: Run data probe or frozen research
        working-directory: research-repo
        shell: bash
        run: |
          set -o pipefail
          if [ -f research/ashare_event_absorption/run_research.py ]; then
            python research/ashare_event_absorption/run_research.py 2>&1 | tee research_outputs/ashare_event_absorption_run.log
          else
            python research/ashare_event_absorption/probe_data.py 2>&1 | tee research_outputs/ashare_event_absorption_probe/run.log
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashare-event-absorption-results
          path: research-repo/research_outputs
          if-no-files-found: warn
          retention-days: 14
