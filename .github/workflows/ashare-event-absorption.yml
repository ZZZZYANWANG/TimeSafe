name: A-share Event Absorption Research

on:
  push:
    branches: [main]
    paths:
      - experiments/ashare_event_absorption_trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone isolated research branch
        run: |
          git clone --depth 1 --branch research-ashare-event-absorption-20261120 https://github.com/ZZZZYANWANG/TradingView-API.git research-repo
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn pyarrow requests baostock tabulate matplotlib
      - name: Run point-in-time frozen research
        working-directory: research-repo
        shell: bash
        run: |
          set -o pipefail
          mkdir -p research_outputs/ashare_event_absorption research_outputs/ashare_event_absorption_probe
          if [ -f research/ashare_event_absorption/run_research_v6_resilient.py ]; then
            python research/ashare_event_absorption/run_research_v6_resilient.py 2>&1 | tee research_outputs/ashare_event_absorption_run.log
          elif [ -f research/ashare_event_absorption/run_research_v5_daily.py ]; then
            python research/ashare_event_absorption/run_research_v5_daily.py 2>&1 | tee research_outputs/ashare_event_absorption_run.log
          elif [ -f research/ashare_event_absorption/run_research_v4.py ]; then
            python research/ashare_event_absorption/run_research_v4.py 2>&1 | tee research_outputs/ashare_event_absorption_run.log
          elif [ -f research/ashare_event_absorption/run_research_v3.py ]; then
            python research/ashare_event_absorption/run_research_v3.py 2>&1 | tee research_outputs/ashare_event_absorption_run.log
          else
            python research/ashare_event_absorption/probe_data.py 2>&1 | tee research_outputs/ashare_event_absorption_probe/run.log
          fi
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashare-event-absorption-results
          path: |
            research-repo/research_outputs/ashare_event_absorption/*.csv
            research-repo/research_outputs/ashare_event_absorption/*.json
            research-repo/research_outputs/ashare_event_absorption_run.log
            research-repo/research_outputs/ashare_event_absorption_probe/*.json
            research-repo/research_outputs/ashare_event_absorption_probe/*.log
          if-no-files-found: warn
          retention-days: 14
