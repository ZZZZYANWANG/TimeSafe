name: Fluid Round16 Multiscale Constitutive

on:
  push:
    branches: [main]
    paths:
      - experiments/round16_multiscale_constitutive_trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone isolated research branch
        run: |
          git clone --depth 1 --branch research-fluid-multiscale-constitutive-round16-20261119 https://github.com/ZZZZYANWANG/TradingView-API.git research-repo
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy 'pandas<3' scipy scikit-learn requests pyarrow huggingface-hub tabulate
      - name: Run multiscale conservation and constitutive research
        working-directory: research-repo
        shell: bash
        run: |
          set -o pipefail
          rm -rf research_outputs/fluid_multiscale_constitutive_round16
          mkdir -p research_outputs/fluid_multiscale_constitutive_round16
          python research/fluid_round16/run_multiscale_constitutive.py 2>&1 | tee research_outputs/fluid_multiscale_constitutive_round16/run.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-multiscale-constitutive-round16-results
          path: research-repo/research_outputs/fluid_multiscale_constitutive_round16
          if-no-files-found: warn
          retention-days: 14
