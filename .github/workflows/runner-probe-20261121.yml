name: quantum-open-system-research

on:
  push:
    branches: [runner-probe-20261121]
    paths:
      - ".github/workflows/runner-probe-20261121.yml"
      - "research/quantum_open_system_factor_search.py"
      - "research/quantum_open_system_factor_search_fast.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quantum-open-system-research-runner-probe-20261121
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runner-probe-20261121
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn pyarrow yfinance
      - name: Execute strict quantum factor research
        env:
          PYTHONHASHSEED: "20261121"
        run: |
          cd research
          python quantum_open_system_factor_search_fast.py
      - name: Commit inspectable evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/quantum_open_system_results
          if git diff --cached --quiet; then
            echo "No evidence changes to commit"
          else
            git commit -m "research: record quantum open-system factor evidence"
            git push origin HEAD:runner-probe-20261121
          fi
