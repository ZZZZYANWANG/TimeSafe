name: runner-probe-20261121

on:
  push:
    branches: [runner-probe-20261121]
    paths: [".github/workflows/runner-probe-20261121.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -c "import sys, platform; print(sys.version); print(platform.platform())"
