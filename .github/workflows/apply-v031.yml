name: Apply TimeSafe v0.3.1 patch

on:
  push:
    branches: [fix/v0.3.1-final-hardening]
    paths:
      - ".bootstrap_v031/**"
      - ".github/workflows/apply-v031.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.3.1-final-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap_v031/part_00 \
            .bootstrap_v031/part_01 \
            .bootstrap_v031/part_02 \
            .bootstrap_v031/part_03 \
            .bootstrap_v031/part_04a \
            .bootstrap_v031/part_04b \
            .bootstrap_v031/part_05 \
            > /tmp/timesafe_v031_patch.b64
          base64 --decode /tmp/timesafe_v031_patch.b64 > /tmp/timesafe_v031_patch.xz
          echo "3ae6b8088f895dd5aa9f87512c999f38c8a72359386dbfc177a29aba06e92dac  /tmp/timesafe_v031_patch.xz" | sha256sum --check --strict
          xz -dc /tmp/timesafe_v031_patch.xz > /tmp/timesafe_v031.patch
          git apply --check /tmp/timesafe_v031.patch
          git apply /tmp/timesafe_v031.patch
          git diff --check

      - name: Install complete development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate patched source
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src tests examples experiments
          bash -n experiments/actr20_public/run_all.sh
          pytest --cov=timesafe_quant --cov-report=term-missing --cov-fail-under=85
          python -m build
          python -m venv /tmp/timesafe-v031-wheel
          /tmp/timesafe-v031-wheel/bin/pip install dist/*.whl
          /tmp/timesafe-v031-wheel/bin/python -c "import timesafe_quant; assert timesafe_quant.__version__ == '0.3.1'"
          /tmp/timesafe-v031-wheel/bin/timesafe demo --output /tmp/timesafe_demo.json

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap_v031
          rm -f .github/workflows/apply-v031.yml
          rm -rf build dist src/*.egg-info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden TimeSafe v0.3.1 temporal evidence [skip bootstrap]"
          git push origin HEAD:fix/v0.3.1-final-hardening
