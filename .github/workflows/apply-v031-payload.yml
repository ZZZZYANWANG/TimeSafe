name: Apply TimeSafe v0.3.1 payload

on:
  push:
    branches: [fix/v0.3.1-final-hardening-r2]
    paths:
      - ".bootstrap/v031_part_*"
      - ".github/workflows/apply-v031-payload.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip v031 bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.3.1-final-hardening-r2
          fetch-depth: 0

      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/v031_part_00 \
            .bootstrap/v031_part_00b \
            .bootstrap/v031_part_01a \
            .bootstrap/v031_part_01b \
            .bootstrap/v031_part_02 \
            .bootstrap/v031_part_03 \
            .bootstrap/v031_part_04 \
            .bootstrap/v031_part_05 \
            .bootstrap/v031_part_06 \
            > /tmp/timesafe_v031.b64
          test "$(wc -c < /tmp/timesafe_v031.b64)" -eq 77312
          base64 --decode /tmp/timesafe_v031.b64 > /tmp/timesafe_v031.tar.xz
          echo "18864c628e431bcd818c370211143d6bdd2dbc31c6288622801e124af3193347  /tmp/timesafe_v031.tar.xz" | sha256sum --check --strict

      - name: Apply clean source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/timesafe_v031.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/apply-v031-payload.yml
          find . -type d \( -name __pycache__ -o -name .pytest_cache -o -name .ruff_cache -o -name .hypothesis \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '.coverage' \) -delete
          python - <<'PY'
          from pathlib import Path

          for name in (
              "tests/test_cli.py",
              "tests/test_compare.py",
              "tests/test_maturity.py",
              "tests/test_prefix.py",
              "tests/test_refit_determinism.py",
          ):
              path = Path(name)
              path.write_text(path.read_text(encoding="utf-8").rstrip("\n") + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Commit and push applied source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden TimeSafe v0.3.1 temporal evidence [skip v031 bootstrap]"
          git push origin HEAD:fix/v0.3.1-final-hardening-r2
