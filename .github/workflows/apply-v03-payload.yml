name: Apply TimeSafe v0.3 payload

on:
  push:
    branches: [feature/v0.3-real-model-validation]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/apply-v03-payload.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-real-model-validation
          fetch-depth: 0

      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/xz_part_* > /tmp/timesafe_v03_payload.b64
          base64 --decode /tmp/timesafe_v03_payload.b64 > /tmp/timesafe_v03_payload.tar.xz
          echo "aafd8d65f8d494711c2d2e81bdd697b673aca3214652d41883177386b9278a93  /tmp/timesafe_v03_payload.tar.xz" | sha256sum --check --strict

      - name: Apply clean source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/timesafe_v03_payload.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/apply-v03-payload.yml
          if find . -type d -name __pycache__ -o -name .pytest_cache -o -name .ruff_cache | grep -q .; then
            echo "Unexpected cache directory in release payload" >&2
            exit 1
          fi
          if find . -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '.coverage' \) | grep -q .; then
            echo "Unexpected generated file in release payload" >&2
            exit 1
          fi

      - name: Commit applied payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement TimeSafe v0.3 real-model validation [skip bootstrap]"
          git push origin HEAD:feature/v0.3-real-model-validation
