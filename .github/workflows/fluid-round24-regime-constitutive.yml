name: Fluid regime-dependent constitutive operator round24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fluid-round24-regime-constitutive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn requests pyarrow tabulate huggingface_hub
      - name: Checkout frozen research code
        run: |
          git clone --depth 1 --branch research-fluid-regime-constitutive-round24-20261119 https://github.com/ZZZZYANWANG/TradingView-API.git research_repo
      - name: Run final corrected Round24
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          cd research_repo
          python research/fluid_round24/run_regime_constitutive_round24_final.py 2>&1 | tee ../fluid-round24.log
      - name: Preserve evidence and log
        if: always()
        run: |
          mkdir -p round24-artifact
          cp -r research_repo/research_outputs/fluid_regime_constitutive_round24/* round24-artifact/ 2>/dev/null || true
          cp fluid-round24.log round24-artifact/run.log 2>/dev/null || true
      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-regime-constitutive-round24-final-results
          path: round24-artifact
          if-no-files-found: error
          retention-days: 14
      - name: Publish audit evidence branch
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B audit-fluid-regime-constitutive-round24-final-20261119
          rm -rf audit/fluid_regime_constitutive_round24_final
          mkdir -p audit/fluid_regime_constitutive_round24_final
          cp -r round24-artifact/. audit/fluid_regime_constitutive_round24_final/
          git add audit/fluid_regime_constitutive_round24_final
          git commit -m 'audit: freeze final regime-dependent constitutive round24 evidence' || exit 0
          git push origin HEAD:audit-fluid-regime-constitutive-round24-final-20261119
