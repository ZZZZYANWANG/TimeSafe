name: Fluid Round19 Public A-share Memory

on:
  push:
    branches:
      - research-fluid-public-memory-round19-20261119
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install baostock pandas numpy scipy scikit-learn pyarrow
      - name: Run frozen experiment
        run: python research/fluid_round19/run_public_ashare_memory.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-round19-public-ashare-memory-results
          path: research/fluid_round19/results
          if-no-files-found: warn
          retention-days: 14
