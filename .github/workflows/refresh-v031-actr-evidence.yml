name: Refresh TimeSafe v0.3.1 ACTR evidence

on:
  push:
    branches: [fix/v0.3.1-final-hardening-r3]
    paths: [".github/workflows/refresh-v031-actr-evidence.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.3.1-final-hardening-r3
          fetch-depth: 0

      - name: Refresh content-addressed ACTR evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          results = root / "experiments/actr20_public/results/reference_v031"
          run_id = "5a24a531da244dbdbc6a34d637e0f180"
          implementation = "9c29aaae8621203446af7d68d6d5beaf11c2166972f20424f412cb2a210dc592"
          old_run_id = "a54e118cc8d64828ba400038c220f1d0"
          old_implementation = "2c4e0e0e82463a9c2ede359224b83f92c5cdb323fb278ad919eae878c8836052"

          digest = hashlib.sha256()
          experiment_root = root / "experiments/actr20_public"
          package_root = root / "src/timesafe_quant"
          paths = sorted(experiment_root.glob("*.py")) + sorted(package_root.glob("*.py"))
          for path in paths:
              logical = (
                  f"experiment/{path.relative_to(experiment_root).as_posix()}"
                  if path.is_relative_to(experiment_root)
                  else f"timesafe_quant/{path.relative_to(package_root).as_posix()}"
              )
              payload = path.read_bytes()
              digest.update(logical.encode("utf-8"))
              digest.update(b"\0")
              digest.update(str(len(payload)).encode("ascii"))
              digest.update(b"\0")
              digest.update(payload)
              digest.update(b"\0")
          observed_implementation = digest.hexdigest()
          assert observed_implementation == implementation, (
              observed_implementation,
              implementation,
          )

          report_path = results / "ACTR20_TIMESAFE_EXPERIMENT.md"
          report = report_path.read_text(encoding="utf-8")
          assert report.count(old_run_id) == 1
          assert report.count(old_implementation) == 1
          report = report.replace(old_run_id, run_id).replace(old_implementation, implementation)
          report_path.write_text(report, encoding="utf-8")

          config_path = results / "benchmark_config.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["experiment_run_id"] = run_id
          config["implementation_sha256"] = implementation
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          audits_path = results / "timesafe_audits.json"
          audits = json.loads(audits_path.read_text(encoding="utf-8"))
          audits["identity"]["experiment_run_id"] = run_id
          audits["identity"]["implementation_sha256"] = implementation
          audits["worker_artifact_sha256"] = {
              "mature_feedback_prefix": "db2564517744a3d61dd27955253d1297158ae59cb2311f20876f841d30cbefa4",
              "legal_refit": "6feb7a9e845de8c556703bc478013712cec5d4f2f1a5120f8ea6c66fa516fed6",
              "full_sample_negative_control": "0203c304c4f6185af4b4e6aa945e1042491c193caac73714ddd0453df06e9d47",
              "legal_availability": "53c3a2d1d7cbbe23a94f4572621a70590131ec5ec0fed4bffb11825886d54a5d",
              "immature_label_negative_control": "e5f8bcca7d182b99231ff2e0ec106da3b0eb9fe442518b1617fc33d9e8b6218a",
              "refit_determinism": "2379f64a6b5bb7f6e7ded7f82f218f8c8b79b2354894b3bfccc10dafefbfd43d",
              "label_maturity_and_purge": "debbeea8949df66aabfc9d0025f1b90f9cc4246c84062ac38e13d52751720b56",
          }
          audits_path.write_text(json.dumps(audits, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          metadata = {
              "status": "PASS",
              "experiment": "TimeSafe x ACTR-20 privacy-hardened public benchmark",
              "timesafe_version": "0.3.1",
              "experiment_run_id": run_id,
              "implementation_sha256": implementation,
              "experiment_contract_version": "actr20-timesafe-audit-v1",
              "external_package": "ACTR20_JQ_Public_Research_Package_20261110",
              "external_benchmark_sha256": "dcc663779842c5701440f16015ceb36fe0555bc125f33f8b8f8e53ca9a02e128",
              "external_manifest_sha256": "4e482c68c8578983712752c5d3e35afd78c7dc31a03820927edf76e11c559ba7",
              "rows": 109499,
              "sessions": 1810,
              "audit_asset_ids_sha256": "088889b8071756d3559dc2172e525644f0be09d4b3fb26a697070bddcb805338",
              "audit_asset_count": 24,
              "audit_rows": 36399,
              "audit_sessions": 1810,
              "planned_checkpoints": [1000, 1200, 1450, 1700],
              "max_abs_rankic_difference": 9.020562075079397e-17,
              "actr_hac_p_difference": 8.651933336434325e-17,
              "all_expected_audit_verdicts": True,
              "observed_verdicts": {
                  "mature_feedback_prefix": "PASS",
                  "legal_refit": "WARN",
                  "full_sample_negative_control": "FAIL",
                  "legal_availability": "WARN",
                  "immature_label_negative_control": "FAIL",
                  "refit_determinism": "WARN",
                  "label_maturity_and_purge": "PASS",
              },
              "worker_artifact_hashes_recorded": True,
              "execution_mode": "explicit isolated stages",
              "execution_note": "Benchmark and all seven audit workers completed in isolated Python processes; aggregate non-sensitive evidence only is committed.",
              "elapsed_seconds": 55.549,
              "python_runtime": "3.13.5",
          }
          (results / "RESULTS_METADATA.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          names = [
              "ACTR20_TIMESAFE_EXPERIMENT.md",
              "RESULTS_METADATA.json",
              "benchmark_config.json",
              "benchmark_pairs.csv",
              "benchmark_summary.csv",
              "benchmark_verification.json",
              "timesafe_audits.json",
          ]
          expected = {
              "ACTR20_TIMESAFE_EXPERIMENT.md": "b50d2bb138c0803dbeb700e3481da4948c97eb621a6a0e45f5aed2a67782d2b6",
              "RESULTS_METADATA.json": "08a168505879f58295c20fc114d90f63dcfdfbd56bfbc4d5b8f594f866c78f30",
              "benchmark_config.json": "1dfa79b57d1471953e09524a430efa7f1d6ba783de05b88fce2737a097d69cc9",
              "benchmark_pairs.csv": "600467b17594734508e7a1f6b870e2e0ce93802a9383685f64834039f7e7c228",
              "benchmark_summary.csv": "987674c9a86b34a163b69ac6706b83732c854c5aea1fa310937c366fc094fb5f",
              "benchmark_verification.json": "7b1d7277343704418df786bdf089906722379d40b7e62b02a97050354075513f",
              "timesafe_audits.json": "156bfa9b01ecf7ce0d0cc6b35b37dc98b13e058a06ea27a16f8d9c731a9c9d6d",
          }
          manifest_lines = []
          for name in names:
              observed = hashlib.sha256((results / name).read_bytes()).hexdigest()
              assert observed == expected[name], (name, observed, expected[name])
              manifest_lines.append(f"{observed}  {name}")
          (results / "MANIFEST.sha256").write_text(
              "\n".join(manifest_lines) + "\n",
              encoding="utf-8",
          )
          PY

          rm -f .github/workflows/refresh-v031-actr-evidence.yml
          git diff --check

      - name: Commit refreshed evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: refresh ACTR evidence for final v0.3.1 implementation"
          git push origin HEAD:fix/v0.3.1-final-hardening-r3
