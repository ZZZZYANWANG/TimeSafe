name: Fluid hierarchical constitutive round25

on:
  push:
    branches:
      - main
    paths:
      - 'research/fluid_round25/**'
      - '.github/workflows/fluid-round25-hierarchical-constitutive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Check out frozen research branch
        uses: actions/checkout@v4
        with:
          repository: ZZZZYANWANG/TradingView-API
          ref: research-fluid-hierarchical-constitutive-round25-20261119
          path: tradingview-api
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tradingview-api/requirements.txt
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn requests pyarrow tabulate huggingface_hub
      - name: Run frozen Round25 research
        env:
          PYTHONUNBUFFERED: '1'
        working-directory: tradingview-api
        run: |
          python research/fluid_round25/run_hierarchical_constitutive_round25.py 2>&1 | tee ../fluid-round25.log
      - name: Preserve log on failure
        if: always()
        run: |
          mkdir -p tradingview-api/research_outputs/fluid_hierarchical_constitutive_round25
          cp fluid-round25.log tradingview-api/research_outputs/fluid_hierarchical_constitutive_round25/run.log || true
      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-hierarchical-constitutive-round25-results
          path: tradingview-api/research_outputs/fluid_hierarchical_constitutive_round25
          if-no-files-found: error
          retention-days: 14
