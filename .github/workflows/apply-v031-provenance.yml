name: Apply TimeSafe v0.3.1 provenance correction

on:
  push:
    branches: [fix/v0.3.1-provenance-final]
    paths:
      - ".bootstrap_v031/**"
      - ".github/workflows/apply-v031-provenance.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.3.1-provenance-final
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify and apply provenance correction
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap_v031/supplement_00 > /tmp/timesafe_v031_supplement.xz
          echo "c9a559761796fa612b91a25b65b980b1ca5a1730e32a328a2047e44584f22192  /tmp/timesafe_v031_supplement.xz" | sha256sum --check --strict
          xz -dc /tmp/timesafe_v031_supplement.xz > /tmp/timesafe_v031_supplement.patch
          git apply --check /tmp/timesafe_v031_supplement.patch
          git apply /tmp/timesafe_v031_supplement.patch
          git diff --check

      - name: Install complete development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate corrected source
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src tests examples experiments
          bash -n experiments/actr20_public/run_all.sh
          pytest --cov=timesafe_quant --cov-report=term-missing --cov-fail-under=85
          python -m build
          python -m venv /tmp/timesafe-v031-wheel
          /tmp/timesafe-v031-wheel/bin/pip install dist/*.whl
          /tmp/timesafe-v031-wheel/bin/python -c "import timesafe_quant; assert timesafe_quant.__version__ == '0.3.1'"
          /tmp/timesafe-v031-wheel/bin/timesafe demo --output /tmp/timesafe_demo.json

      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap_v031
          rm -f .github/workflows/apply-v031-provenance.yml
          rm -rf build dist src/*.egg-info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: bind v0.3.1 evidence to exact implementation [skip bootstrap]"
          git push origin HEAD:fix/v0.3.1-provenance-final
